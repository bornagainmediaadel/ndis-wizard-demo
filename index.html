--ink:#003521;--txt:#173F30;--mut:#58A185;--bd:#DDF5EC;--row:#EAFAF4;--bg:#F3FCF9;--cream:#FAF5F0;--sand:#EDDECB;
--red:#C8251B;--redbg:#FBE7E5;--amber:#A8620C;--amberbg:#FDF1DE;--green:#1F7A4D;--greenbg:#E2F3EA;--side:212px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Poppins,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
b,strong{font-weight:600}
.hide{display:none!important}
/* ---------- primitives ---------- */
.lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--blue);background:var(--sky);padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.35}
.chip.sm{font-size:10px;padding:2px 8px}
.chip.g{color:var(--green);background:var(--greenbg)}.chip.r{color:var(--red);background:var(--redbg)}.chip.a{color:var(--amber);background:var(--amberbg)}.chip.m{color:var(--mut);background:var(--row)}.chip.w{background:#fff}
.chip.on{color:#fff;background:var(--blue)}
button.chip{border:0;font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.2;transition:background .15s,transform .1s,opacity .2s}
.btn:hover{background:var(--blued);border-color:var(--blued)}.btn:active{transform:scale(.97)}
.btn.sm{font-size:11.5px;padding:6px 13px}.btn.xs{font-size:11px;padding:4px 11px}.btn.lg{font-size:13.5px;padding:11px 18px}.btn.blk{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--bd)}.btn.ghost:hover{background:var(--bg)}
.btn.navy{background:var(--navy);border-color:var(--navy)}
.btn.dark{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}.btn.dark:hover{background:rgba(255,255,255,.14)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.done{background:var(--greenbg);color:var(--green);border-color:var(--greenbg);pointer-events:none}
.btn svg{flex:none}
.panel{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ptitle>div:first-child{font-size:14px;font-weight:700;color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--row);font-size:12.5px}
.kv:last-child{border-bottom:0}.kv>span:first-child{color:var(--txt);min-width:0}.kv>span:last-child{font-weight:600;white-space:nowrap;text-align:right}
.muted{color:var(--mut)}.sub{font-size:11.5px;color:var(--mut)}
.av{display:block;flex:none;border-radius:50%;background-size:cover;background-position:center;background-color:#D5FDEE}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.tbl{width:100%}
.tr{display:grid;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--row);font-size:12.5px}
.tr.th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.tr>div{min-width:0}
.tr.hl{background:var(--sky);border-radius:8px}
.tr.click{cursor:pointer;transition:background .15s}.tr.click:hover{background:var(--bg)}
.toggle{width:36px;height:20px;border-radius:999px;background:#C0E4D6;display:inline-flex;align-items:center;padding:2px;flex:none;border:0;transition:background .2s}
.toggle i{width:16px;height:16px;border-radius:50%;background:#fff;display:block;transition:transform .2s}
.toggle.on{background:var(--blue)}.toggle.on i{transform:translateX(16px)}
/* ---------- app frame ---------- */
#app{min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--navy);padding:20px 12px 14px;display:flex;flex-direction:column;gap:2px;z-index:20;overflow-y:auto}
.side .brand{padding:4px 10px 6px}.side .brand img{height:46px;max-width:100%;object-fit:contain;display:block}
.side .pw{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#77D8B4;margin-top:8px;font-weight:600}
.side .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0 8px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:#B3EFD8;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.05);color:#fff}
.nav.on{background:rgba(35,234,168,.14);color:#fff;font-weight:600}
.nav .badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.nav.on .pip{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.side .foot{margin-top:auto;padding:12px 10px 0;display:flex;flex-direction:column;gap:10px}
.online{display:flex;align-items:center;gap:8px;font-size:11px;color:#A4E9CF}
.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 26px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.2}
.top .tsub{font-size:12px;color:var(--mut)}
.top .tr8{display:flex;align-items:center;gap:10px;flex:none}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:999px;padding:7px 14px;color:var(--mut);font-size:12px;white-space:nowrap;background:#fff;cursor:pointer}
.search:hover{border-color:var(--skybd)}
.me{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;border:0}
.content{padding:22px 26px 40px;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1480px;width:100%}
.view{animation:viewin .38s cubic-bezier(.2,.7,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;color:#C3FAE8;background:rgba(255,255,255,.07);border-radius:999px;padding:4px 10px;letter-spacing:.02em;white-space:nowrap}
.demo-badge .dot{width:6px;height:6px;background:#F5B544}
.linkbtn{background:none;border:0;padding:0;color:#8EFBD7;font-size:11px;font-weight:600;text-align:left}
.linkbtn:hover{color:#fff}
/* ---------- toasts, menus, drawer ---------- */
#toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:14px;font-size:12.5px;max-width:380px;animation:toastin .3s cubic-bezier(.2,.7,.2,1);pointer-events:auto}
.toast .ti{width:22px;height:22px;border-radius:50%;background:#3DDC97;display:flex;align-items:center;justify-content:center;flex:none}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(6px)}}
.scrim{position:fixed;inset:0;background:rgba(0,26,16,.42);z-index:100;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:100%;background:#fff;z-index:101;padding:24px;overflow-y:auto;animation:slidein .32s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;gap:14px}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.close{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;border:0;background:var(--row);display:flex;align-items:center;justify-content:center}
.menu{position:fixed;z-index:120;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:8px;min-width:240px;animation:toastin .2s}
.menu .mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:12.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.menu .mi:hover{background:var(--bg)}
.palette{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:560px;max-width:92vw;background:#fff;border-radius:16px;z-index:101;overflow:hidden;animation:toastin .2s}
.palette input{width:100%;border:0;border-bottom:1px solid var(--bd);padding:16px 18px;font-size:15px;font-family:inherit;outline:none}
.palette .pl{max-height:50vh;overflow:auto;padding:6px}
.palette .pi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px}
.palette .pi.sel,.palette .pi:hover{background:var(--sky)}
/* ---------- dashboard ---------- */
.band{background:linear-gradient(120deg,var(--navy) 0%,#00633E 55%,#006E49 100%);border-radius:18px;padding:20px 22px 18px;position:relative;overflow:hidden;color:#fff}
.band:before{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(35,234,168,.35),rgba(35,234,168,0) 70%)}
.band .bh{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;flex-wrap:wrap}
.band .eyb{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8EFBD7;font-weight:600}
.band .bt{font-size:19px;font-weight:700;margin-top:2px}
.gauges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:16px;position:relative}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.gauge .gw{position:relative}
.gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4px}
.gauge .gn{font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.gauge .gs{font-size:9.5px;color:#BCF2DE;margin-top:4px;letter-spacing:.03em;white-space:nowrap}
.gauge .gl{font-size:12px;font-weight:600;text-align:center;line-height:1.25}
.kpi{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kpi .kv2{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:11.5px;margin-top:2px}
.rtile{border-radius:11px;padding:10px 11px;min-width:0;cursor:pointer;border:0;text-align:left;font-family:inherit;transition:transform .15s,filter .15s}

.rtile .rn{font-size:11.5px;font-weight:600;line-height:1.25}

.rtile .rp b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.rtile .rp span{font-size:10px;opacity:.85;white-space:nowrap}
.qi{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--row);transition:opacity .35s,transform .35s,max-height .4s,padding .4s;max-height:140px;overflow:hidden}
.qi:last-child{border-bottom:0}
.qi .qs{font-size:10.5px;color:var(--blue);font-weight:600}
.qi .qt{font-size:13px;font-weight:600;line-height:1.3}
.qi .qd{font-size:11.5px;color:var(--mut);line-height:1.35}
.qi .qb{display:flex;gap:6px}
.qi.gone{opacity:0;transform:translateX(30px);max-height:0;padding:0}
.qi.flash{animation:flash 1.2s}
@keyframes flash{0%{background:var(--sky)}100%{background:transparent}}
.feed{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--row)}
.feed:last-child{border-bottom:0}
.feed .ft{font-size:12px;color:var(--txt);line-height:1.4;min-width:0}
.feed .fw{font-size:10.5px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:5px}
.feed.new{animation:feedin .6s cubic-bezier(.2,.7,.2,1)}
@keyframes feedin{from{opacity:0;transform:translateY(-8px);background:var(--sky)}to{opacity:1;transform:none}}
.feedwrap{max-height:330px;overflow:hidden}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 10px;color:var(--mut);font-size:12.5px;text-align:center}
.empty .ei{width:44px;height:44px;border-radius:50%;background:var(--greenbg);display:flex;align-items:center;justify-content:center}
/* ---------- agents ---------- */
.acard{cursor:pointer;transition:transform .15s,border-color .15s;padding:13px}
.acard:hover{transform:translateY(-2px);border-color:var(--skybd)}
.acard.paused{opacity:.55}
.acard .ad{font-size:11.5px;color:var(--txt);margin:8px 0 6px;line-height:1.4;min-height:32px}
/* ---------- voice ---------- */
.voice{background:radial-gradient(ellipse at 50% 30%,#014E31 0%,var(--navy) 60%);border-radius:18px;display:grid;grid-template-columns:230px minmax(0,1fr) 360px;min-height:calc(100vh - 130px);color:#fff;overflow:hidden}
.vroster{padding:16px 12px;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.vr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;width:100%;font-family:inherit;transition:background .15s}
.vr:hover{background:rgba(255,255,255,.05)}
.vr.on{background:rgba(35,234,168,.16)}
.vr .vn{font-size:12.5px;font-weight:600;color:#D6F5EB}.vr.on .vn{color:#fff}
.vr .vj{font-size:10px;color:#87DFBE;line-height:1.3}.vr.on .vj{color:#8EFBD7}
.vcentre{display:flex;flex-direction:column;align-items:center;padding:20px 18px;gap:10px;min-width:0}
.vpill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 14px 5px 5px;font-size:12.5px;font-weight:600;max-width:100%}
.vpill .vpj{font-size:11.5px;color:#8EFBD7;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstatus{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:600;display:flex;align-items:center;gap:7px;min-height:16px}
.vsaid{font-size:22px;font-weight:600;text-align:center;line-height:1.3;max-width:520px;letter-spacing:-.01em;min-height:58px}
.vsaid .caret{display:inline-block;width:2px;height:1em;background:var(--cyan);margin-left:2px;vertical-align:-3px;animation:pulse 1s infinite}
.vchips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:560px}
.vchip{font-size:11.5px;font-weight:600;color:#C3FAE8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;transition:background .15s}
.vchip:hover{background:rgba(111,255,207,.18);color:#fff}
.vchip:disabled{opacity:.4;cursor:default}
.micbtn{width:68px;height:68px;border-radius:50%;border:0;background:linear-gradient(145deg,#14BE85,var(--blue));display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s}
.micbtn:hover{transform:scale(1.05)}
.micbtn:before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(20,190,133,.35),rgba(20,190,133,0) 70%)}
.micbtn.live:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--cyan);animation:ring 1.4s infinite}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.5);opacity:0}}
.vtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.vtog{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:#BCF2DE;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-family:inherit}
.vtog .toggle{width:30px;height:17px}.vtog .toggle i{width:13px;height:13px}.vtog .toggle.on i{transform:translateX(13px)}
.vconv{padding:16px;border-left:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.vconv .vch{display:flex;justify-content:space-between;align-items:center}
.vlog{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;padding-right:2px;scroll-behavior:smooth}
.turn{display:flex;gap:8px;max-width:94%;width:max-content;box-sizing:border-box;align-self:flex-start;animation:feedin .4s}
.turn .tb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#E3F9F2;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:12.5px;line-height:1.5;min-width:0}
.turn .tb .tn{font-size:10.5px;color:var(--cyan);font-weight:600;margin-bottom:2px}
.turn.me{align-self:flex-end;max-width:86%}
.turn.me .tb{background:var(--blue);border-color:var(--blue);color:#fff;border-radius:16px 16px 4px 16px}
.turn.sys .tb{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.3);color:#BFF3DA}
.rb{background:linear-gradient(160deg,rgba(0,135,90,.22),rgba(0,135,90,.08));border:1px solid rgba(111,255,207,.35);border-radius:14px;padding:12px 14px;animation:feedin .4s}
.rb .rbh{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.rb .rbt{font-size:13px;color:#fff;line-height:1.5;margin:7px 0 4px}
.rb .rbto{font-size:11px;color:#A4E9CF}
.rb .rbb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rb.ok{border-color:rgba(61,220,151,.5)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:#8EFBD7;animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
/* orb */
.orbw{position:relative;transition:transform .5s}
.orb .spin{transform-origin:150px 150px;animation:spin 18s linear infinite}
.orb .spinr{transform-origin:150px 150px;animation:spin 26s linear infinite reverse}
.orb .spinf{transform-origin:150px 150px;animation:spin 10s linear infinite}
.orb .core{transform-origin:150px 150px;animation:breathe 4s ease-in-out infinite}
.orb .glow{transform-origin:150px 150px;animation:breathe 4s ease-in-out infinite;filter:blur(14px)}
.orb .spokes{transform-origin:150px 150px;animation:spin 40s linear infinite}
.orb .halo{transform-origin:150px 150px;animation:breathe 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.vs-listening .orb .core,.vs-listening .orb .glow{animation-duration:1.1s}
.vs-listening .orb .spokes{animation-duration:8s}
.vs-thinking .orb .spinf{animation-duration:2.4s}.vs-thinking .orb .spokes{animation-duration:14s}
.vs-speaking .orb .core,.vs-speaking .orb .glow{animation:talk .42s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.wave{display:flex;align-items:center;justify-content:center}
.wave span{display:block;border-radius:3px;transform-origin:center;animation:wv 1.2s ease-in-out infinite;transform:scaleY(.35)}
@keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.vs-idle .wave span{animation-duration:2.6s;opacity:.45!important}
.vs-listening .wave span{animation-duration:.55s}
.vs-speaking .wave span{animation-duration:.7s}
/* ---------- other screens ---------- */
.sblock{border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.3;border:1px solid var(--skybd);background:var(--sky);color:var(--ink);transition:all .4s}
.sblock .sp{opacity:.85}
.sblock.gap{background:var(--redbg);color:var(--red);border-color:#F3C9C4}
.sblock.new{background:#E6F6EE;color:var(--green);border-color:#BFE5CF;animation:flash 1.4s}
.cand{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--row)}
.cand:last-child{border-bottom:0}
.cand .ci{width:28px;height:28px;border-radius:50%;background:var(--sky);color:var(--blue);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.nitem{padding:10px 11px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--row);transition:background .15s}
.nitem:hover{background:var(--bg)}.nitem.sel{background:var(--sky);border-bottom-color:transparent}
.fld{padding:8px 0;border-bottom:1px solid var(--row)}
.fld .fk{display:flex;gap:6px;align-items:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.fld .fv{font-size:12.5px;margin-top:2px;line-height:1.5;outline:none;border-radius:6px}
.editing .fv{background:#FFFBEA;padding:2px 6px;margin-left:-6px}
.pbar{height:8px;border-radius:4px;background:var(--row);position:relative;margin:6px 0 4px}
.pbar i{display:block;height:8px;border-radius:4px;width:0;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.pbar .mark{position:absolute;left:50%;top:-3px;width:2px;height:14px;background:var(--navy)}
.ringw{position:relative;flex:none}
.ringw .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.ring-arc{transition:stroke-dasharray 1.2s cubic-bezier(.2,.7,.2,1)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em}
.portal{background:var(--cream);border-radius:18px;overflow:hidden}
.portal .ph{background:var(--navy);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

.portal .pn span{cursor:pointer}.portal .pn span.on{color:#fff;font-weight:600}
.viewas{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.lturn{align-self:flex-start;display:flex;gap:8px;max-width:92%}
.lturn .tb{background:#fff;border:1px solid var(--bd);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:12.5px}
.lturn .tb .tn{font-size:10.5px;color:var(--blue);font-weight:600}
.lme{align-self:flex-end;max-width:80%;background:var(--blue);color:#fff;border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:12.5px;animation:feedin .4s}
.inp{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:999px;padding:5px 5px 5px 14px;background:#fff}
.inp input{flex:1;border:0;outline:none;font-family:inherit;font-size:12.5px;min-width:0;background:transparent}
.ask{display:flex;align-items:center;gap:8px;border:1px solid var(--skybd);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--ink)}
.answer{font-size:12.5px;line-height:1.6;color:var(--txt);margin-top:10px;min-height:60px}
.ledger-new{animation:flash 2.4s}
.conn .cm{width:32px;height:32px;border-radius:9px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.brain{background:linear-gradient(135deg,#EEFCF7,#fff);border:1px solid var(--skybd)}
.rule{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--row);font-size:12px;line-height:1.45}
.rule:last-child{border-bottom:0}
/* sign-in */
.signin{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;cursor:pointer}
.si-l{background:linear-gradient(160deg,var(--navy) 0%,#00633E 70%,#006E49 100%);padding:48px 56px;display:flex;flex-direction:column;gap:22px;color:#fff;position:relative;overflow:hidden}

 body{background:var(--bg);font-size:14px}

.tchn{font-weight:600;color:var(--ink);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tchc{display:flex;justify-content:center}
.pdoc{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--row);font-size:12.5px}.pdoc b{color:var(--ink)}.pdoc .sub{font-size:11px}
.pdb{display:flex;gap:6px;flex:none}
.sevc{border:1px solid var(--bd);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:#fff}
.sevh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sevm{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0}.sevm span{font-size:10.5px;font-weight:700;text-align:center;padding:5px 2px;border-radius:7px}
.sevg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;font-size:12px}.sevg b{color:var(--ink);font-weight:600;line-height:1.35}.sevg .lab{font-size:9px}
.sevl{font-size:12px;line-height:1.45;color:var(--txt)}.sevcs{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--blue);background:var(--sky);border-radius:9px;padding:6px 9px;margin-top:8px}
.sevp{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.stamp{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin-bottom:8px;flex-wrap:wrap}
.xplay{width:22px;height:22px;border-radius:50%;border:0;background:var(--blue);display:inline-flex;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle;cursor:pointer}
.xplay.on{background:var(--green)}
.snap{border:0;background:none;padding:0;cursor:pointer}.snapi{display:flex;flex-direction:column;gap:3px;width:40px;height:30px;border:1px solid var(--bd);border-radius:5px;background:#fff;padding:5px 5px}
.snapi i{display:block;height:3px;border-radius:2px;background:var(--skybd)}.snapi i:first-child{background:var(--bluel);width:60%}
.snapbig{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-top:12px}.snapbar{display:flex;gap:5px;align-items:center;background:var(--bg);padding:7px 10px;font-size:11px;color:var(--mut)}
.snapbar i{width:8px;height:8px;border-radius:50%;background:var(--skybd)}.snapbar span{margin-left:6px}.snapbody{padding:12px 14px;font-size:12.5px}
.remrule{display:flex;gap:10px;align-items:flex-start;font-size:12.5px}.remrule b{color:var(--ink)}.remrule .sub{font-size:11.5px;line-height:1.45}
.mbar{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);padding:8px 10px}
.mbar select{border:1px solid var(--bd);border-radius:999px;padding:7px 10px;font:inherit;font-size:12px;color:var(--ink);background:#fff;max-width:240px;min-width:0}
.mbar input{flex:1;min-width:0;border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font:inherit;font-size:12.5px;outline:none}
.mbar .mbc{font-size:12px;font-weight:600;color:var(--blue);white-space:nowrap;padding:0 4px}
.mbar.fx{position:fixed;left:var(--side);right:0;bottom:0;z-index:35;border-width:1px 0 0;box-shadow:0 -6px 20px rgba(2,21,14,.06);padding:9px 26px}
body.has-mbar .content{padding-bottom:86px}body.has-mbar .dock{bottom:70px}
.dock-tab{display:none!important}
.mbar.in{border-radius:16px;flex-wrap:wrap;margin-top:4px}.mbar.in select{flex:1 1 100%;max-width:none}
.wkr .wkg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.vq{margin:10px auto 0;width:min(100%,420px);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}.vq input{color:#fff}.vq input::placeholder{color:#94E8C8}
.kpanel .kprom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.kp{display:flex;gap:9px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px;font-size:12.5px}.kp b{color:var(--ink)}.kp .sub{font-size:11px;line-height:1.4}
.kgrid{columns:3 230px;column-gap:18px}.kcol{break-inside:avoid;margin-bottom:12px}.kcol .lab{margin-bottom:4px}.kitem{font-size:11.5px;line-height:1.35;padding:4px 0;border-bottom:1px solid var(--row);color:var(--txt)}
.kitem.hi{color:var(--blue);font-weight:700}

 try{return JSON.parse(m?m[2]:s.slice(s.indexOf('['),s.lastIndexOf(']')+1))}catch(e){throw new Error("Couldn't read the database reply.")}}
async function raw(method,path,body){
 if(L.mode==='mcp'){const id=Number((await sql(`select wizard_call(${lit(method)}, ${lit(path)}, ${lit(JSON.stringify(body||{}))}::jsonb, ${lit(L.session)}) as id`))[0].id);
  const t0=Date.now();let w=350;
  while(Date.now()-t0<150000){await sleep(w);w=Math.min(1200,w+150);const r=(await sql(`select public.wizard_result(${id}) as r`))[0].r;
   if(r&&r.done){if(r.error||r.timed_out)throw new Error(r.timed_out?'The agent took too long. Try a smaller run.':r.error);return{status:Number(r.status),body:r.body}}}
  throw new Error('No reply from the agents API after 150 seconds.')}
 const r=await fetch((path.startsWith('/xero/')?LCFG.fn.replace(/ndis-wizard$/,'wizard-xero'):path.startsWith('/ops/')?LCFG.fn.replace(/ndis-wizard$/,'wizard-ops'):path.startsWith('/registers/')?LCFG.fn.replace(/ndis-wizard$/,'wizard-registers'):LCFG.fn)+path+(/[?&]source=astalty/i.test(location.search)?(path.includes('?')?'&':'?')+'source=astalty':''),{method,headers:{'content-type':'application/json','x-wizard-session':L.session||''},body:method==='GET'?undefined:JSON.stringify(body||{})});
 let j=null;try{j=await r.json()}catch(e){}return{status:r.status,body:j}}
async function api(path,body,onp){const method=body===undefined?'GET':'POST';let b=body;
 for(let k=0;k<5;k++){const r=await raw(method,k&&method==='GET'?path+(path.includes('?')?'&':'?')+'resume=1':path,b);
  if(r.status===401&&path!=='/login'){L.session=null;L.me=null;ls.set('wiz.session',null);rerender();throw new Error('Your session ended. Sign in again.')}
  if(r.status===202&&r.body&&r.body.resume){onp&&onp(`Fetched ${r.body.fetched} ShiftCare responses so far. Continuing…`);b=method==='POST'?Object.assign({},body||{},{__resume:true}):undefined;continue}
  if(r.status>=400)throw new Error((r.body&&r.body.error)||`Request failed (${r.status}).`);
  return r.body}
 throw new Error('ShiftCare data took too many rounds to fetch. Try again in a minute.')}

  if(e&&e.code==='rate_limited')throw new Error('Claude is busy for your account right now. Try again in a minute.');throw new Error((e&&e.message)||"Claude didn't answer.")}}

 clearTimeout(L.chgT);L.chgT=setTimeout(()=>{if(ROUTE==='live-changes'&&!document.hidden){L.chgNeed=1;rerender()}},8000);
 const o=L.chg,items=new Map(((o&&o.items)||[]).map(i=>[i.id,i]));
 const groups=[];for(const r of (o&&o.rows)||[]){const g=groups[groups.length-1];const gk=r.item_id||('s:'+r.source+':'+String(r.t).slice(0,16));if(g&&g.k===gk)g.rows.push(r);else groups.push({k:gk,item:r.item_id,src:r.source,t:r.t,rows:[r]})}
 const segs=[['','All'],['shiftcare','ShiftCare'],['xero','Xero'],['wizard','Wizard approvals']];

 if(!o)return top+panel('<div class="sub">Loading changes…</div>');
 if(!groups.length)return top+panel(`<div style="text-align:center;padding:36px 12px"><div style="font-size:16px;font-weight:700;color:${C.ink}">${dot(C.green,8,true)} Watching for changes…</div><div class="sub" style="margin-top:6px">Nothing has changed in ShiftCare or Xero since you opened this. Approve something in the review queue and it shows up here.</div></div>`);
 return top+groups.map(g=>{const it=g.item&&items.get(g.item),m=(it&&it.map)||{};
  const head=it?`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${av(AGN[it.agent]||'Wizard',30)}<div style="min-width:0;flex:1"><div style="font-size:13.5px;font-weight:700;color:${C.ink}">${un(it.title,m)}</div><div style="font-size:12.5px;margin-top:3px;color:${C.txt}"><b>${E(it.status==='approved'?'Approved':it.status)}</b> by ${E(it.decided_by_name||it.decided_by||'')}${it.decided_role?` (${E(it.decided_role)})`:''} on ${E(adl(it.decided_at||g.t))}${it.applied?`. ${E(it.applied.summary||'')}`:''}</div>${it.applied&&(it.applied.steps||[]).length?`<div style="font-size:12.5px;margin-top:4px;color:${C.txt}">${it.applied.steps.map(x=>`<div>✓ ${E(x)}</div>`).join('')}</div>`:''}</div></div>`:`<div style="font-size:13px;font-weight:700;color:${C.ink};margin-bottom:6px">${E(g.src||'Change')} <span class="sub">· ${E(adl(g.t))} · ${g.rows.length} change${g.rows.length===1?'':'s'}</span></div>`;
  const shown=g.rows.slice(0,40);
  return `<div class="panel ${L.chgFocus&&L.chgFocus===g.item?'lfocus':''}" id="${g.item?'cg-'+E(g.item):''}" style="padding:14px">${head}${shown.map(r=>chgRow(r,m)).join('')}${g.rows.length>shown.length?`<div class="sub">…and ${g.rows.length-shown.length} more</div>`:''}</div>`}).join('')});

 panel(ptitle('ClickUp tasks (sample)',chip('not connected yet','a',true))+(cu.length?cu.map(t=>`<div class="tr" style="grid-template-columns:.7fr 2fr 1fr .8fr"><div>${chip(E(t.id),'m',true)}</div><div><b>${E(t.name)}</b><div class="sub" style="white-space:pre-wrap">${E(t.description)}</div></div><div>${E(t.assignee_role)}</div><div class="sub">${E(adl(t.created_at))}</div></div>`).join(''):'<div class="sub">No tasks yet. Approve a flagged progress note to create one.</div>'))});

 if(a==='pickacct'){L.f.lu=d.u;rerender();return}

 if(a==='logout'){ls.set('wiz.noauto','1');raw('POST','/logout',{}).catch(()=>{});L.session=null;L.me=null;ls.set('wiz.session',null);rerender();return}
 if(a==='notesref'){L.notes=null;rerender();return}
 if(a==='note'){const n=(L.notes||[]).find(x=>x.id===d.id);L.noteSel=d.id;L.f.nmsg=n.message;L.f.ncl=n.client;L.f.nst=n.staff;rerender();return}
 if(a==='ncheck')return run('ncheck',async()=>{const sel=(L.notes||[]).find(x=>x.id===L.noteSel);const body=sel&&L.f.nmsg===sel.message?{note_id:sel.id}:{note:{message:L.f.nmsg||'',client:L.f.ncl||'',staff:L.f.nst||''}};const it=await api('/notes/check',body);L.out.notes={items:[it]};L.msg_n=`${it.flags.length} flag(s). Added to the review queue for the team leader.`});
 if(a==='nplanted')return run('ncheck',async()=>{const r=await api('/notes/check-batch',{ids:['229','230','231','232','233']});L.out.notes={items:r.items};L.msg_n=`${r.checked} notes checked, ${r.flagged} flagged, ${r.api_calls} ShiftCare calls.`});
 if(a==='invpick'){L.invSel[d.r]=!L.invSel[d.r];rerender();return}
 if(a==='icheck'||a==='iall'||a==='icsv')return run('icheck',async()=>{const body=a==='iall'?{refs:'all'}:a==='icsv'?{invoices_csv:L.f.icsv||'',shifts_csv:L.f.scsv||''}:{refs:Object.keys(L.invSel).filter(k=>L.invSel[k])};if(body.refs&&!body.refs.length)throw new Error('Select at least one invoice.');const r=await api('/invoice/check',body,p=>{L.msg_i=p});L.out.inv=r;L.msg_i=`${r.queued} exception(s) added to the review queue for Finance. ${r.note}`});
 if(a==='isample'){L.f.icsv=SAMPLE.invoices_csv;L.f.scsv=SAMPLE.shifts_csv;rerender();return}
 if(a==='desk')return run('desk'+d.k,()=>runDesk(d.k));

 if(a==='xcheck')return run('xcheck',async()=>{const r=await api('/xero/check',{},prog('x'));L.out.xero=r;L.msg.x=`${r.summary.findings} findings · ${r.api_calls.shiftcare} ShiftCare and ${r.api_calls.xero} Xero calls · ${r.queued} added to the review queue. ${r.note}`;toast(`${r.summary.findings} findings for review`,'check')});
 if(a==='xreset')return run('xreset',async()=>{const r=await api('/xero/reset-demo',{});L.xs=null;L.out.xero=null;L.msg.x=`Demo Xero file rebuilt for ${r.organisation}: ${Object.entries(r.counts).map(([k,v])=>v+' '+k.toLowerCase()+'s').join(', ')}. ${r.planted.length} gaps planted for Clancy to find.`;toast('Demo Xero data reset','reset')});
 if(a==='echeck'||a==='ecsv')return run('echeck',async()=>{const r=await api('/expiry/check',a==='ecsv'?{csv:L.f.ecsv||''}:{},p=>{L.msg_e=p});L.out.exp=r;L.msg_e=`As at ${r.today} · ${r.checked} dated records · ${r.queued} reminder(s) drafted for the compliance officer.`});
 if(a==='esample'){L.f.ecsv=SAMPLE.docs_csv;rerender();return}
 if(a==='sug'){L.f.hq=d.q;return act('hey',{})}
 if(a==='hey')return run('hey',async()=>{const q=(L.f.hq||'').trim();if(!q)throw new Error('Ask a question first.');const r=await api('/hey',{q});L.out.hey=r;
   if(r.ai&&r.ai.answer){r.claude={model:r.ai.model,text:'',answer:r.ai.answer,draft:r.ai.draft};return}
   if(!L.sample||r.intent==='help')return;r.claude={model:'claude'};rerender();
   try{const c=await askClaude(r.ai_prompt);let p=null;try{p=JSON.parse(c.text.slice(c.text.indexOf('{'),c.text.lastIndexOf('}')+1))}catch(e){}r.claude={model:c.model,text:c.text,answer:p&&p.answer||c.text,draft:p&&p.draft}}catch(e){r.claude={model:'claude',text:'',err:e.message}}});
 if(a==='heydraft')return run('heyd',async()=>{const o=L.out.hey;const it=await api('/hey/draft',{draft:o.claude.draft,question:L.f.hq||'',map:o.map});o.claude.queued=1;o.item=it;toast('Draft added to the review queue','check')});
 if(a==='agent'){L.agent=d.k;if(ROUTE!=='live-agents')go('live-agents');else rerender();return}
 if(a==='rsample'){const r=L.reg.find(x=>x.key===d.k);r.inputs.forEach(i=>L.f['in_'+d.k+'_'+i.id]=i.sample);L.src[d.k]='Sample data';L.msg['r'+d.k]='Sample loaded.';rerender();return}
 if(a==='rlive')return run('live_'+d.k,async()=>{const r=await api('/live/'+d.k,undefined,p=>{L.msg['r'+d.k]=p});const ag=L.reg.find(x=>x.key===d.k);ag.inputs.forEach(i=>{if(r.inputs[i.id]!=null)L.f['in_'+d.k+'_'+i.id]=r.inputs[i.id]});L.src[d.k]='ShiftCare';L.msg['r'+d.k]=`Loaded from ShiftCare (${r.api_calls} API calls). Check it, then run.`});
 if(a==='rrun')return run('run_'+d.k,async()=>{const ag=L.reg.find(x=>x.key===d.k),inputs={};ag.inputs.forEach(i=>inputs[i.id]=L.f['in_'+d.k+'_'+i.id]||'');const r=await api('/run/'+d.k,{inputs,source:L.src[d.k]||'CSV upload'});L.out['reg_'+d.k]=r;L.msg['r'+d.k]=''});

  if(it.status==='approved'&&FIXES[it.agent]){L.busy['ap'+it.id]=1;rerender();try{const r=await api(`/xero/apply/${encodeURIComponent(it.id)}`,{});it=r.item;putItem(it);L.chg=null}catch(e){L.err['ap'+it.id]=e.message}delete L.busy['ap'+it.id]}
  toast(`${it.status[0].toUpperCase()+it.status.slice(1)} · ${(it.applied&&it.applied.applied?it.applied.changes+' change(s) made · ':'')+(it.result_note||'')}`.slice(0,160),it.status==='approved'?'check':'x');for(const k in L.out)if(k.startsWith('q:'))delete L.out[k];count()}catch(e){L.err['d'+d.id]=e.message}rerender();return}
 if(a==='apply')return run('ap'+d.id,async()=>{const r=await api(`/xero/apply/${encodeURIComponent(d.id)}`,{});putItem(r.item);L.chg=null;toast(`${r.item.applied.changes||0} change(s) made`,'check')});
 if(a==='gochanges'){L.chgFocus=d.id||null;L.chgScrolled=0;L.chg=null;go('live-changes');return}
 if(a==='chgsys'){L.chgSys=d.v;L.chg=null;rerender();return}

 if(a==='chgref'){L.chg=null;rerender();return}
 if(a==='chgall'){L.chgAll=!L.chgAll;L.chg=null;rerender();return}

 if(a==='claude')return claudeReview(d.id);
 if(a==='claudeall'){const o=L.out[d.k];const items=Array.isArray(o)?o:o&&o.items||[];return claudeAll(items.map(i=>i.id))}
 if(a==='copy'){const it=L.items.get(d.id);try{await navigator.clipboard.writeText(plain(it.ai.rewrite,it.map));toast('Rewrite copied','check')}catch(e){toast('Select the rewrite text to copy it','x')}return}
}
